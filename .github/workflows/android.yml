name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Build pinned runtime payloads
        run: NDK="$ANDROID_HOME/ndk/29.0.14206865" ./build-payload.sh
      - name: Build and lint APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: InfinityLock-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InfinityLock-debug
          path: apk
      - name: Publish debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ci-${BUILD_NUMBER}"
          file="InfinityLock-ci-${BUILD_NUMBER}-debug.apk"
          mv apk/app-debug.apk "$file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --target "$COMMIT" --prerelease --title "InfinityLock build ${BUILD_NUMBER}" --notes 'Automated debug APK for the supported Vivo X200 Ultra firmware. CI checks passed. Debug signing keys can differ between builds; installing over a differently signed APK requires reinstalling the app. Root attempts and reboot reliability are not tested by CI.'
          fi
